version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # One PR for all Actions updates instead of one per action.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
  # Opens PRs that bump the submodule pointers. Each module's own dependencies
  # (go.mod / pyproject.toml) need a dependabot.yml in that module's repository.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule: { interval: weekly }
