name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [sentinel, vault, tracker, navigator]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  navigator-e2e:
    name: go (navigator e2e, qdrant)
    runs-on: ubuntu-24.04
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: navigator/go.sum
      - name: wait for qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/collections >/dev/null && exit 0
            sleep 2
          done
          echo "qdrant did not become ready" >&2; exit 1
      - name: end-to-end test
        working-directory: navigator
        env:
          NAVIGATOR_E2E_QDRANT: localhost:6333
        run: |
          go test ./internal/api/rest -run QdrantE2E -v -count=1 | tee e2e.log
          # A skipped test would silently prove nothing.
          if grep -q -- '--- SKIP' e2e.log; then echo "e2e test was skipped" >&2; exit 1; fi

  exceptions-e2e:
    name: go (exceptions e2e, nats)
    runs-on: ubuntu-24.04
    services:
      nats:
        image: nats:2.10-alpine
        ports: ['4222:4222']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: tracker/go.sum
      - name: wait for nats
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/4222) 2>/dev/null && exit 0
            sleep 2
          done
          echo "nats did not become ready" >&2; exit 1
      - name: end-to-end test
        working-directory: tracker
        env:
          EXCEPTIONS_E2E_NATS: localhost:4222
        run: |
          go test ./internal/exceptions -run E2E -v -count=1 | tee e2e.log
          # A skipped test would silently prove nothing.
          if grep -q -- '--- SKIP' e2e.log; then echo "e2e test was skipped" >&2; exit 1; fi

  exceptions-nats-python:
    name: python (exceptions over live nats, ${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [anchor, navigator]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The tests start their own nats-server (they must stop and restart it to prove the client
      # catches up after an outage, which a service container cannot do). Same release line as the
      # nats:2.10 image used by the Go job, pinned to an exact version.
      - name: install nats-server
        working-directory: ${{ runner.temp }}
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/nats-io/nats-server/v2@v2.10.22
          "$RUNNER_TEMP/bin/nats-server" --version
      # Only what the client needs: the full module install pulls in torch, which these tests do not use.
      - name: install
        run: python -m pip install --upgrade pip 'nats-py>=2.7' cryptography pytest pytest-timeout
      - name: exceptions over a live bus
        working-directory: ${{ matrix.module }}
        env:
          NATS_SERVER_BIN: ${{ runner.temp }}/bin/nats-server
        run: |
          python -m pytest tests/test_exceptions_nats.py -q -rs --timeout=120 | tee nats.log
          # A skipped test would silently prove nothing.
          if grep -Eq '[0-9]+ skipped' nats.log; then echo "live NATS tests were skipped" >&2; exit 1; fi

  workbench:
    name: go (workbench)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: workbench/go.mod
      - name: vet and test (fake Sentinel, Anchor and Ollama)
        working-directory: workbench
        run: |
          go vet ./...
          go test -count=1 ./...

  integration:
    name: go (cross-module tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sentinel/go.sum
            vault/go.sum
      - run: go vet ./tests/...
      - run: go test ./tests/...

  python:
    name: python (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [anchor, navigator]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.module }}/pyproject.toml
      - name: install
        working-directory: ${{ matrix.module }}
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -e . pytest pytest-asyncio pytest-timeout
      - name: nltk data
        if: matrix.module == 'navigator'
        run: python -c "import nltk; [nltk.download(p) for p in ('punkt', 'punkt_tab')]"
      - name: test
        working-directory: ${{ matrix.module }}
        run: pytest tests -q --timeout=60

  scripts:
    name: shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: syntax check
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck --severity=error scripts/*.sh
