name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [sentinel, vault, tracker, navigator]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  navigator-e2e:
    name: go (navigator e2e, qdrant)
    runs-on: ubuntu-24.04
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: navigator/go.sum
      - name: wait for qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/collections >/dev/null && exit 0
            sleep 2
          done
          echo "qdrant did not become ready" >&2; exit 1
      - name: end-to-end test
        working-directory: navigator
        env:
          NAVIGATOR_E2E_QDRANT: localhost:6333
        run: |
          go test ./internal/api/rest -run QdrantE2E -v -count=1 | tee e2e.log
          # A skipped test would silently prove nothing.
          if grep -q -- '--- SKIP' e2e.log; then echo "e2e test was skipped" >&2; exit 1; fi

  integration:
    name: go (cross-module tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sentinel/go.sum
            vault/go.sum
      - run: go vet ./tests/...
      - run: go test ./tests/...

  python:
    name: python (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [anchor, navigator]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.module }}/pyproject.toml
      - name: install
        working-directory: ${{ matrix.module }}
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -e . pytest pytest-asyncio pytest-timeout
      - name: nltk data
        if: matrix.module == 'navigator'
        run: python -c "import nltk; [nltk.download(p) for p in ('punkt', 'punkt_tab')]"
      - name: test
        working-directory: ${{ matrix.module }}
        run: pytest tests -q --timeout=60

  scripts:
    name: shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: syntax check
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck --severity=error scripts/*.sh
